name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
   runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o thabat-ios.zip && cd thabat-ios && brew install xcodegen && xcodegen generate
      - run: cd thabat-ios && xcodebuild -project Thabat.xcodeproj -scheme Thabat -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -40; exit ${PIPESTATUS[0]}
      - run: cd thabat-ios && mkdir Payload && cp -r build/Build/Products/Release-iphoneos/Thabat.app Payload/ && zip -r ../Thabat.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Thabat-ipa
          path: Thabat.ipa
